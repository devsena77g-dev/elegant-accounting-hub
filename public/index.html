                            '100%': { opacity: '1', transform: 'translateY(0)' },

    <!-- Custom Styles -->
    <style>
        * {
            scroll-behavior: smooth;
        }
        
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #c9a227 0%, #e4c55e 50%, #c9a227 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-gradient {
            background: linear-gradient(135deg, #1e3a5f 0%, #243b53 50%, #102a43 100%);
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #c9a227 0%, #e4c55e 100%);
        }
        
        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(30, 58, 95, 0.25);
        }
        
        .nav-link {
            position: relative;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #c9a227, #e4c55e);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .testimonial-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
        }
        
        .service-icon {
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.1) 0%, rgba(228, 197, 94, 0.1) 100%);
        }
        
        .blob {
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #c9a227;
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
        }
        
        .faq-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .faq-content.open {
            max-height: 500px;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #c9a227 0%, #e4c55e 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.4);
        }

        .range-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #c9a227 0%, #e4c55e 100%);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.4);
        }
    </style>
</head>

        // ============ ANIMATED COUNTER ============
        const AnimatedCounter = ({ end, duration = 2000, suffix = '' }) => {
            const [count, setCount] = useState(0);
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.5 }
                );
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            
            useEffect(() => {
                if (!isVisible) return;
                
                let startTime;
                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);
                    setCount(Math.floor(progress * end));
                    if (progress < 1) requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }, [isVisible, end, duration]);
            
            return <span ref={ref}>{count}{suffix}</span>;
        };

            const calculateSavings = () => {
                let baseTax = revenue * 0.32; // Simplified base tax
                let potentialSavings = 0;
                let strategies = [];

                // Entity structure optimization
                if (entityType === 'sole-proprietor' && revenue > 100000) {
                    const sCorpSavings = Math.min(revenue * 0.153 * 0.4, 50000);
                    potentialSavings += sCorpSavings;
                    strategies.push({ name: 'S-Corp Election', savings: sCorpSavings, desc: 'Reduce self-employment taxes' });
                }

                // Retirement plan
                if (!hasRetirementPlan && revenue > 50000) {
                    const retirementSavings = Math.min(66000, revenue * 0.25) * 0.32;
                    potentialSavings += retirementSavings;
                    strategies.push({ name: 'Retirement Plan Setup', savings: retirementSavings, desc: 'Solo 401(k) or SEP-IRA contributions' });
                }

                // R&D Credits
                if (hasRD) {
                    const rdSavings = Math.min(revenue * 0.05, 250000);
                    potentialSavings += rdSavings;
                    strategies.push({ name: 'R&D Tax Credits', savings: rdSavings, desc: 'Federal research & development credits' });

                    potentialSavings += qbiSavings;
                    strategies.push({ name: 'QBI Deduction', savings: qbiSavings, desc: 'Qualified Business Income deduction' });
                }

                    const benefitsSavings = employees * 2000;
                    potentialSavings += benefitsSavings;
                    strategies.push({ name: 'Employee Benefits', savings: benefitsSavings, desc: 'Health insurance & benefit deductions' });
                }

                return { baseTax, potentialSavings, strategies, effectiveRate: ((baseTax - potentialSavings) / revenue * 100).toFixed(1) };

                                                    onChange={handleChange}
                                                    required
                                                    className="w-full px-4 py-3 rounded-lg border border-navy-200 focus:ring-2 focus:ring-gold-500/20 transition-all"
                                                    placeholder="john@company.com"
                                                />
                                            </div>
                                        </div>
                                        
                                        <div className="grid md:grid-cols-2 gap-4 mb-4">
                                            <div>
                                                <label className="block text-navy-700 font-medium mb-2 text-sm">Phone Number</label>
                                                <input
                                                    type="tel"
                                                    name="phone"
                                                    value={formData.phone}
                                                    onChange={handleChange}
                                                    className="w-full px-4 py-3 rounded-lg border border-navy-200 focus:ring-2 focus:ring-gold-500/20 transition-all"
                                                    placeholder="(555) 123-4567"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-navy-700 font-medium mb-2 text-sm">Company Name</label>
                                                <input
                                                    type="text"
                                                    name="company"
                                                    value={formData.company}
                                                    onChange={handleChange}
                                                    className="w-full px-4 py-3 rounded-lg border border-navy-200 focus:ring-2 focus:ring-gold-500/20 transition-all"
                                                    placeholder="Your Company"
                                                />
                                            </div>
                                        </div>
                                        
                                        <div className="mb-4">
                                            <label className="block text-navy-700 font-medium mb-2 text-sm">Service Interested In</label>
                                            <select
                                                name="service"
                                                value={formData.service}
                                                onChange={handleChange}
                                                className="w-full px-4 py-3 rounded-lg border border-navy-200 focus:ring-2 focus:ring-gold-500/20 transition-all bg-white"
                                            >
                                                <option value="">Select a service</option>
                                                <option value="tax">Tax Planning & Preparation</option>
                                                <option value="audit">Audit & Assurance</option>
                                                <option value="advisory">Financial Advisory</option>
                                                <option value="bookkeeping">Bookkeeping Services</option>
                                                <option value="payroll">Payroll Solutions</option>
                                                <option value="formation">Business Formation</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>
                                        
                                        <div className="mb-6">
                                            <label className="block text-navy-700 font-medium mb-2 text-sm">Message</label>
                                            <textarea
                                                name="message"
                                                value={formData.message}
                                                onChange={handleChange}
                                                rows="4"
                                                className="w-full px-4 py-3 rounded-lg border border-navy-200 focus:ring-2 focus:ring-gold-500/20 transition-all resize-none"
                                                placeholder="Tell us about your needs..."
                                            ></textarea>
                                        </div>
                                        
                                        <button
                                            type="submit"
                                            disabled={isSubmitting}
                                            className="w-full gold-gradient text-navy-900 py-4 rounded-full font-semibold text-lg hover:shadow-lg hover:shadow-gold-500/30 transition-all disabled:opacity-70 flex items-center justify-center"
                                        >
                                            {isSubmitting ? (
                                                <>
                                                    <svg className="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    Sending...
                                                </>
                                            ) : (
                                                'Schedule Consultation'
                                            )}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // ============ FOOTER ============
        const Footer = ({ setCurrentPage }) => {
            const [email, setEmail] = useState('');
            
            const footerLinks = {
                services: [
                    { name: 'Tax Planning', page: 'service-detail', id: 'tax-planning' },
                    { name: 'Audit & Assurance', page: 'service-detail', id: 'audit' },
                    { name: 'Financial Advisory', page: 'service-detail', id: 'advisory' },
                    { name: 'Bookkeeping', page: 'service-detail', id: 'bookkeeping' },
                    { name: 'Payroll Solutions', page: 'service-detail', id: 'payroll' },
                ],
                company: [
                    { name: 'About Us', anchor: '#about' },
                    { name: 'Our Team', anchor: '#team' },
                    { name: 'Case Studies', page: 'case-studies' },
                    { name: 'News & Insights', anchor: '#resources' },
                    { name: 'Contact', anchor: '#contact' },
                ],
                resources: [
                    { name: 'Tax Calculator', page: 'calculator' },
                    { name: 'Financial Templates', anchor: '#' },
                    { name: 'Industry Reports', anchor: '#' },
                    { name: 'Webinars', anchor: '#' },
                    { name: 'Client Portal', page: 'portal' },
                ],
            };

            const handleLinkClick = (link, serviceId = null) => {
                if (link.page) {
                    if (link.page === 'service-detail' && serviceId) {
                        setCurrentPage('home');
                        setTimeout(() => {
                            document.querySelector('#services')?.scrollIntoView({ behavior: 'smooth' });
                        }, 100);
                    } else {
                        setCurrentPage(link.page);
                        window.scrollTo(0, 0);
                    }
                } else if (link.anchor) {
                    setCurrentPage('home');
                    setTimeout(() => {
                        document.querySelector(link.anchor)?.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }
            };
            
            return (
                <footer className="bg-navy-950 text-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        {/* Newsletter */}
                        <div className="py-12 border-b border-navy-800">
                            <div className="grid lg:grid-cols-2 gap-8 items-center">
                                <div>
                                    <h3 className="font-display text-2xl font-bold mb-2">Stay Informed</h3>
                                    <p className="text-navy-300">Subscribe to our newsletter for the latest tax tips and financial insights.</p>
                                </div>
                                <form className="flex gap-3" onSubmit={(e) => e.preventDefault()}>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="Enter your email"
                                        className="flex-1 px-4 py-3 rounded-full bg-navy-900 border border-navy-700 text-white placeholder-navy-400 focus:outline-none focus:border-gold-500"
                                    />
                                    <button
                                        type="submit"
                                        className="gold-gradient text-navy-900 px-6 py-3 rounded-full font-semibold hover:shadow-lg hover:shadow-gold-500/30 transition-all"
                                    >
                                        Subscribe
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        {/* Main Footer */}
                        <div className="py-12 grid md:grid-cols-2 lg:grid-cols-5 gap-8">
                            <div className="lg:col-span-2">
                                <div className="flex items-center space-x-3 mb-6">
                                    <div className="w-10 h-10 gold-gradient rounded-lg flex items-center justify-center">
                                        <span className="text-navy-900 font-display font-bold text-xl">S</span>
                                    </div>
                                    <span className="font-display text-xl font-semibold text-white">
                                        Sterling & Associates
                                    </span>
                                </div>
                                <p className="text-navy-300 mb-6 max-w-sm">
                                    Your trusted partner for comprehensive accounting, tax, and financial advisory services since 1999.
                                </p>
                                <div className="flex gap-4">
                                    <a href="#" className="w-10 h-10 bg-navy-800 rounded-full flex items-center justify-center text-navy-300 hover:bg-gold-500 hover:text-navy-900 transition-colors">
                                        <Icons.LinkedIn />
                                    </a>
                                    <a href="#" className="w-10 h-10 bg-navy-800 rounded-full flex items-center justify-center text-navy-300 hover:bg-gold-500 hover:text-navy-900 transition-colors">
                                        <Icons.Twitter />
                                    </a>
                                    <a href="#" className="w-10 h-10 bg-navy-800 rounded-full flex items-center justify-center text-navy-300 hover:bg-gold-500 hover:text-navy-900 transition-colors">
                                        <Icons.Facebook />
                                    </a>
                                </div>
                            </div>
                            
                            <div>
                                <h4 className="font-semibold text-white mb-4">Services</h4>
                                <ul className="space-y-3">
                                    {footerLinks.services.map((link, index) => (
                                        <li key={index}>
                                            <button onClick={() => handleLinkClick(link, link.id)} className="text-navy-300 hover:text-gold-400 transition-colors text-left">
                                                {link.name}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="font-semibold text-white mb-4">Company</h4>
                                <ul className="space-y-3">
                                    {footerLinks.company.map((link, index) => (
                                        <li key={index}>
                                            <button onClick={() => handleLinkClick(link)} className="text-navy-300 hover:text-gold-400 transition-colors text-left">
                                                {link.name}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="font-semibold text-white mb-4">Resources</h4>
                                <ul className="space-y-3">
                                    {footerLinks.resources.map((link, index) => (
                                        <li key={index}>
                                            <button onClick={() => handleLinkClick(link)} className="text-navy-300 hover:text-gold-400 transition-colors text-left">
                                                {link.name}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                        
                        {/* Bottom Footer */}
                        <div className="py-6 border-t border-navy-800 flex flex-col md:flex-row justify-between items-center gap-4">
                            <p className="text-navy-400 text-sm">
                                © 2024 Sterling & Associates. All rights reserved.
                            </p>
                            <div className="flex gap-6 text-sm">
                                <a href="#" className="text-navy-400 hover:text-gold-400 transition-colors">Privacy Policy</a>
                                <a href="#" className="text-navy-400 hover:text-gold-400 transition-colors">Terms of Service</a>
                                <a href="#" className="text-navy-400 hover:text-gold-400 transition-colors">Cookie Policy</a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // ============ HOME PAGE ============
        const HomePage = ({ setCurrentPage, setSelectedService }) => (
            <>
                <HeroSection setCurrentPage={setCurrentPage} />
                <ClientsSection />
                <ServicesSection setCurrentPage={setCurrentPage} setSelectedService={setSelectedService} />
                <AboutSection />
                <TeamSection />
                <TestimonialsSection />
                <PricingSection />
                <FAQSection />
                <ResourcesSection />
                <CTASection />
                <ContactSection />
            </>
        );
        
        // ============ MAIN APP ============
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [selectedService, setSelectedService] = useState('tax-planning');

            const renderPage = () => {
                switch(currentPage) {
                    case 'case-studies':
                        return <CaseStudiesPage setCurrentPage={setCurrentPage} />;
                    case 'calculator':
                        return <TaxCalculatorPage setCurrentPage={setCurrentPage} />;
                    case 'portal':
                        return <ClientPortalPage setCurrentPage={setCurrentPage} />;
                    case 'service-detail':
                        return <ServiceDetailPage serviceId={selectedService} setCurrentPage={setCurrentPage} />;
                    default:
                        return <HomePage setCurrentPage={setCurrentPage} setSelectedService={setSelectedService} />;
                }
            };

            return (
                <div className="min-h-screen">
                    <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    {renderPage()}
                    <Footer setCurrentPage={setCurrentPage} />
                </div>
            );
        };
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
